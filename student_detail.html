<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 정밀 진단 리포트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-8 text-gray-800">

    <div class="max-w-5xl mx-auto">
        <button onclick="history.back()" class="flex items-center text-gray-500 hover:text-indigo-600 font-bold mb-6 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> 클래스 대시보드로 돌아가기
        </button>

        <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200 flex items-center justify-between mb-8">
            <div class="flex items-center">
                <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl font-black mr-6">
                    🧑‍🎓
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-900"><span id="s-name">이름</span> 학생 <span class="text-lg text-gray-500 font-medium ml-2">학습 진단 리포트</span></h1>
                    <div class="flex space-x-3 mt-3">
                        <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm font-bold shadow-sm" id="s-theta">능력치: 0.0</span>
                        <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm font-bold shadow-sm" id="s-tendency">성향</span>
                    </div>
                </div>
            </div>
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-md flex items-center transition-colors">
                <i data-lucide="message-square" class="w-5 h-5 mr-2"></i> 1:1 메시지 보내기
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-8">
                <div class="bg-gradient-to-br from-indigo-900 to-slate-800 p-8 rounded-3xl shadow-lg text-white">
                    <h2 class="text-xl font-bold mb-4 flex items-center text-indigo-300">
                        <i data-lucide="bot" class="mr-2"></i> AI 자동 진단 코멘트
                    </h2>
                    <p id="s-comment" class="text-lg leading-relaxed font-medium text-indigo-50">
                        데이터를 분석하고 있습니다...
                    </p>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200">
                    <h2 class="text-xl font-bold mb-6 flex items-center text-orange-600 border-b border-gray-100 pb-4">
                        <i data-lucide="search" class="mr-2"></i> 집중 관찰 필요 문항 (시간 지연 오답)
                    </h2>
                    <div id="trouble-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                        <p class="text-gray-400 text-center py-10">불러오는 중...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function loadStudentDetail() {
            // URL에서 ?user_id= 번호 가져오기
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('user_id');

            if (!userId) {
                alert("잘못된 접근입니다.");
                history.back();
                return;
            }

            try {
                const response = await fetch(`http://127.0.0.1:8000/api/teacher/student/${userId}`);
                const data = await response.json();

                document.getElementById('s-name').textContent = data.user.name;
                document.getElementById('s-theta').textContent = `IRT 추정 능력치(θ): ${data.user.theta}`;
                document.getElementById('s-tendency').textContent = `학습 성향: ${data.user.learning_tendency}`;
                document.getElementById('s-comment').textContent = data.ai_comment;

                const troubleList = document.getElementById('trouble-list');
                troubleList.innerHTML = '';

                if (data.trouble_questions && data.trouble_questions.length > 0) {
                    data.trouble_questions.forEach(q => {
                        troubleList.innerHTML += `
                            <div class="p-5 border border-orange-200 bg-orange-50/50 rounded-2xl flex flex-col hover:bg-orange-50 transition-colors">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-orange-600 bg-orange-200 px-2.5 py-1 rounded-md">${q.topic}</span>
                                    <span class="text-sm font-bold text-rose-500 flex items-center">
                                        <i data-lucide="clock" class="w-4 h-4 mr-1"></i> 고민 시간: ${q.time_spent}초
                                    </span>
                                </div>
                                <p class="text-gray-800 font-bold">${q.content}</p>
                            </div>
                        `;
                    });
                    lucide.createIcons();
                } else {
                    troubleList.innerHTML = '<p class="text-center text-gray-500 font-medium py-8">시간을 지연하며 틀린 문항이 없습니다! 훌륭합니다.</p>';
                }

            } catch (e) {
                console.error("데이터 로딩 실패", e);
            }
        }

        document.addEventListener('DOMContentLoaded', loadStudentDetail);
    </script>
</body>
</html>
